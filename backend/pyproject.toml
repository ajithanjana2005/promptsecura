[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsecura-backend"
version = "0.1.0"
description = "PromptSecura backend: prompt security analysis (PII, prompt injection, risk scoring)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3.0",
    "presidio-analyzer>=2.2.354,<3.0",
    "spacy>=3.7,<4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "presidio: integration tests that require presidio-analyzer and a spaCy model",
]
